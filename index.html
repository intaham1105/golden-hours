<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>골든타임</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b0d17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="골든타임">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Nanum+Gothic+Coding:wght@400;700&family=VT323&display=swap">
<style>
/* 레이아웃: 16:9 픽셀 무대 하나가 화면 중앙에 놓이고, HUD·휴대폰·통화창이 그 위에 겹친다. 밤 응급 상황이라 어두운 단일 테마. */
:root {
  --bg: #0b0d17;
  --ink: #f4ecdc;
  --muted: #9ba2bd;
  --panel: #141829;
  --line: #3b4266;
  --siren: #ff3d52;
  --amber: #ffc95a;
  --glow: #7af3cc;
  --screen: #10131f;
  --f-display: "Do Hyeon", "Nanum Gothic Coding", sans-serif;
  --f-body: "Nanum Gothic Coding", ui-monospace, monospace;
  --f-digit: "VT323", ui-monospace, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overscroll-behavior: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body);
  display: flex; align-items: center; justify-content: center;
  box-sizing: border-box; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  -webkit-user-select: none; user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

#stage {
  position: relative; width: 640px; height: 360px; max-width: 100%;
  container-type: size; overflow: hidden; background: #000;
  box-shadow: 0 0 0 3px var(--line), 0 0 0 6px #05060b;
}
#cv { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; -webkit-touch-callout: none; }
#stage { transform-origin: center; flex: none; }
#rotHint { position: fixed; left: 0; right: 0; top: max(10px, env(safe-area-inset-top, 0px)); text-align: center; font: 700 14px var(--f-body); color: var(--muted); pointer-events: none; }

/* HUD */
#hud { position: absolute; inset: 0 0 auto 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 2cqw; padding: 2.2cqh 2.4cqw; pointer-events: none; z-index: 10; }
#obj { font: 700 3.3cqh/1.35 var(--f-body); background: rgba(11, 13, 23, .82); border: .45cqh solid var(--line); padding: 1cqh 1.6cqh; max-width: 58%; }
#obj:empty { display: none; }
#obj b { color: var(--amber); font-weight: 700; }
#clock { margin-left: auto; text-align: right; background: rgba(11, 13, 23, .82); border: .45cqh solid var(--line); padding: .4cqh 1.6cqh .8cqh; position: relative; }
/* 오른쪽 위 작은 버튼 (다시 하기 · 설정) */
.hudbtn { pointer-events: auto; font: 700 2.6cqh var(--f-body); color: var(--muted); background: rgba(11, 13, 23, .82); border: .45cqh solid var(--line); padding: .9cqh 1.4cqh; white-space: nowrap; }
.hudbtn:hover { color: var(--ink); }
#restartBtn { margin-left: auto; }
#restartBtn.arm { color: var(--siren); border-color: var(--siren); }
#hudSet + #clock { margin-left: 0; }
#clock small { display: block; font: 700 2.3cqh var(--f-body); letter-spacing: .12em; color: var(--muted); }
#timer { font: 8cqh/0.9 var(--f-digit); color: var(--amber); font-variant-numeric: tabular-nums; }
#clock.low #timer { color: var(--siren); animation: blink .6s steps(2) infinite; }
#pen { position: absolute; right: 1cqh; bottom: -5cqh; font: 4.4cqh var(--f-digit); color: var(--siren); opacity: 0; }
#pen.show { animation: pen 1.4s ease-out; }
@keyframes pen { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(3cqh); } }
@keyframes blink { 50% { opacity: .35; } }

/* 휴대폰 버튼 */
#phoneBtn { position: absolute; right: 2.6cqw; bottom: 3.2cqh; width: 9.5cqh; height: 15cqh; padding: 0; border: .7cqh solid #2d3250; border-radius: 1.6cqh; background: #1a1e30; z-index: 15; display: grid; place-items: center; }
#phoneBtn::before { content: ""; width: 68%; height: 72%; border-radius: .6cqh; background: linear-gradient(#22304f, #141a2c); box-shadow: inset 0 0 0 .4cqh #0b0e18; }
#phoneBtn::after { content: "휴대폰"; position: absolute; bottom: -3.6cqh; left: 50%; transform: translateX(-50%); font: 700 2.2cqh var(--f-body); color: var(--muted); white-space: nowrap; }
.glow { animation: glow 1.1s ease-in-out infinite; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 .5cqh rgba(122, 243, 204, .35), 0 0 2cqh .4cqh rgba(122, 243, 204, .25); } 50% { box-shadow: 0 0 0 .8cqh rgba(122, 243, 204, .9), 0 0 5cqh 1.2cqh rgba(122, 243, 204, .55); } }

/* 휴대폰 */
#phone { position: absolute; left: 50%; bottom: 2.5cqh; width: 40cqw; height: 95cqh; transform: translate(-50%, 112%); transition: transform .45s cubic-bezier(.2, .9, .25, 1); background: #1c1f2e; border: 1.2cqh solid #2c3048; border-radius: 4.5cqh; box-shadow: 0 0 0 .5cqh #0a0b12, 0 3cqh 8cqh rgba(0, 0, 0, .7); display: flex; flex-direction: column; overflow: hidden; z-index: 20; }
#phone.open { transform: translate(-50%, 0); }
.ph-status { height: 6cqh; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 3cqh; font: 700 2.4cqh var(--f-body); color: var(--muted); background: var(--screen); }
.ph-status button { background: none; border: .3cqh solid var(--line); border-radius: 1cqh; padding: .2cqh 1.2cqh; font-size: 2.2cqh; color: var(--ink); }
.ph-screen { flex: 1; position: relative; overflow: hidden; background: var(--screen); min-height: 0; }
.ph-home { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr); align-content: start; gap: 3.2cqh 1cqh; padding: 5cqh 2.6cqh; background: radial-gradient(circle at 30% 20%, #26315a, transparent 60%), radial-gradient(circle at 80% 90%, #3a1e3f, transparent 55%), var(--screen); }
.app { background: none; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: .9cqh; font: 700 2.2cqh var(--f-body); color: var(--ink); }
.ico { width: 8.6cqh; height: 8.6cqh; border-radius: 2.2cqh; display: grid; place-items: center; font: 4.2cqh var(--f-display); color: #fff; box-shadow: inset 0 -.6cqh 0 rgba(0, 0, 0, .25); }
.ico svg { width: 60%; height: 60%; }
.ph-dialer { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--screen); }
.ph-search { padding: 2cqh 2.4cqh 1.4cqh; flex: none; }
.ph-search input { width: 100%; box-sizing: border-box; font: 700 2.9cqh var(--f-body); color: var(--ink); background: #1b2033; border: .4cqh solid var(--line); border-radius: 1.6cqh; padding: 1.2cqh 1.8cqh; }
.ph-search input::placeholder { color: var(--muted); }
.ph-search input.glow { border-color: var(--glow); }
.ph-list { flex: 1; overflow-y: auto; min-height: 0; padding: 0 1.4cqh 1cqh; overscroll-behavior: contain; }
.ph-sec { font: 700 2.1cqh var(--f-body); letter-spacing: .1em; color: var(--muted); padding: 1.4cqh 1cqh .6cqh; }
.ct { width: 100%; display: flex; align-items: center; gap: 1.6cqh; background: none; border: 0; border-radius: 1.4cqh; padding: 1cqh; text-align: left; }
.ct:hover { background: #1b2033; }
.ct.fav { background: #182038; margin-bottom: .8cqh; }
.av { flex: none; width: 5.4cqh; height: 5.4cqh; border-radius: 50%; display: grid; place-items: center; font: 2.8cqh var(--f-display); color: #fff; }
.ctx { min-width: 0; display: flex; flex-direction: column; }
.nm { font: 700 2.7cqh var(--f-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.no { font: 2.2cqh var(--f-body); color: var(--muted); }
.star { margin-left: auto; color: var(--amber); font-size: 2.6cqh; }
.ph-empty { color: var(--muted); font-size: 2.4cqh; padding: 2cqh 1cqh; }
.ph-keypad { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 1.4cqh; padding: 0 4cqh 1.4cqh; min-height: 0; }
.kp-disp { text-align: center; font: 7cqh var(--f-digit); min-height: 7cqh; letter-spacing: .1em; }
.kp-hint { text-align: center; font-size: 2.3cqh; color: var(--muted); min-height: 3cqh; }
.kp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.6cqh 2.4cqh; }
.kp-grid button { height: 7.4cqh; border: 0; border-radius: 2cqh; background: #1d2338; font: 5cqh var(--f-digit); }
.kp-row { display: grid; grid-template-columns: 2fr 1fr; gap: 2cqh; }
.kp-row button { border: 0; border-radius: 2cqh; padding: 1.6cqh 0; font: 700 2.8cqh var(--f-body); }
.kp-call { background: #1f9e5c; color: #fff; }
.kp-del { background: #2a2f47; }
.ph-tabs { flex: none; display: grid; grid-template-columns: 1fr 1fr; border-top: .3cqh solid var(--line); }
.ph-tabs button { background: none; border: 0; padding: 1.6cqh 0; font: 700 2.5cqh var(--f-body); color: var(--muted); }
.ph-tabs button.on { color: var(--glow); }
.ph-homebar { flex: none; height: 5cqh; background: var(--screen); border: 0; display: grid; place-items: center; }
.ph-homebar span { width: 30%; height: .8cqh; border-radius: 1cqh; background: #5a607d; }

/* 통화창 / 대화창 */
#dlg { position: absolute; left: 4cqw; right: 15cqw; bottom: 3cqh; min-height: 24cqh; box-sizing: border-box; background: rgba(9, 11, 20, .95); border: .6cqh solid var(--ink); box-shadow: 0 0 0 .6cqh #06070d, inset 0 0 0 .5cqh #06070d; padding: 1.6cqh 2.6cqh 2.4cqh; z-index: 30; display: flex; flex-direction: column; gap: .8cqh; cursor: pointer; }
.dlg-head { display: flex; align-items: center; gap: 1.2cqh; font: 700 2.3cqh var(--f-body); color: var(--siren); letter-spacing: .08em; }
.dlg-head:empty, .dlg-head.none { display: none; }
.dlg-head i { width: 1.4cqh; height: 1.4cqh; border-radius: 50%; background: var(--siren); animation: blink .8s steps(2) infinite; }
.dlg-head span:last-child { margin-left: auto; font: 3cqh var(--f-digit); color: var(--muted); }
#dlgWho { font: 3.6cqh var(--f-display); color: var(--amber); min-height: 3.6cqh; }
#dlgText { font: 700 3.4cqh/1.5 var(--f-body); white-space: pre-wrap; }
#dlgText.sys { color: var(--muted); font-style: italic; }
#dlg.compact { min-height: 0; left: 28cqw; bottom: 1.6cqh; padding: 1cqh 2.4cqh 1.2cqh; gap: .2cqh; }
#dlg.compact #dlgWho { font-size: 3cqh; min-height: 3cqh; }
#dlg.compact #dlgText { font-size: 3cqh; line-height: 1.4; }
#dlgNext { position: absolute; right: 2cqh; bottom: 1cqh; font: 3cqh var(--f-digit); color: var(--ink); animation: blink .7s steps(2) infinite; }

/* 팝업 */
#pop { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%) scale(.9); z-index: 50; background: #2a0c14; border: .6cqh solid var(--siren); box-shadow: 0 0 0 .6cqh #06070d, 0 0 6cqh rgba(255, 61, 82, .45); padding: 2.6cqh 4cqh; font: 5cqh var(--f-display); color: #fff; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; }
#pop.info { background: #0f2a24; border-color: var(--glow); box-shadow: 0 0 0 .6cqh #06070d, 0 0 6cqh rgba(122, 243, 204, .35); font-size: 4cqh; white-space: normal; text-align: center; width: max-content; max-width: 70cqw; }
#pop.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

/* 터치 방향키 */
/* 터치 조이스틱: 화면 아무 데나 누르고 끌면 그 자리에 스틱이 생긴다. 손을 떼면 기본 자리로 돌아가 흐리게 쉰다 */
#joy { position: absolute; left: 0; right: 14cqw; top: 17cqh; bottom: 0; z-index: 12; display: none; touch-action: none; }
#joyBase { position: absolute; width: 30cqh; height: 30cqh; margin: -15cqh 0 0 -15cqh; border-radius: 50%; background: rgba(20, 24, 41, .45); border: .5cqh solid rgba(155, 162, 189, .5); box-sizing: border-box; opacity: .45; transition: opacity .15s; pointer-events: none; }
#joyKnob { position: absolute; left: 50%; top: 50%; width: 13cqh; height: 13cqh; margin: -6.5cqh 0 0 -6.5cqh; border-radius: 50%; background: rgba(122, 243, 204, .55); border: .5cqh solid rgba(244, 236, 220, .8); box-sizing: border-box; }
#joy.active #joyBase { opacity: .9; }
@media (pointer: coarse) { #joy.on { display: block; } }
/* 휴대폰·태블릿: 화면을 꽉 채우고, 손가락에 맞게 버튼을 키운다 */
@media (pointer: coarse) {
  body { padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  #stage { box-shadow: none; }
  #dlg.compact { top: 15cqh; bottom: auto; left: 18cqw; right: 18cqw; }
  #phoneBtn { width: 12cqh; height: 19cqh; }
  .hudbtn { font-size: 3.4cqh; padding: 1.2cqh 1.8cqh; }
}

/* 타이틀 / 엔딩 */
.ov { position: absolute; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4cqh; text-align: center; background: rgba(7, 8, 15, .9); padding: 4cqh 8cqw; }
.ov h1 { margin: 0; font: 16cqh/1 var(--f-display); color: var(--ink); letter-spacing: .02em; text-shadow: .8cqh .8cqh 0 var(--siren); text-wrap: balance; }
.ov h2 { margin: 0; font: 10cqh/1.05 var(--f-display); text-wrap: balance; }
.ov .eyebrow { font: 700 2.6cqh var(--f-body); letter-spacing: .3em; color: var(--siren); }
.ov p { margin: 0; max-width: 62ch; font: 700 3cqh/1.6 var(--f-body); color: var(--muted); text-wrap: pretty; }
.ov p b { color: var(--ink); }
.ov .keys { font-size: 2.5cqh; color: var(--muted); }
.ov .stats { display: grid; grid-template-columns: auto auto; gap: .6cqh 4cqh; font: 700 3cqh var(--f-body); text-align: left; }
.ov .stats dt { color: var(--muted); } .ov .stats dd { margin: 0; color: var(--ink); font-variant-numeric: tabular-nums; }
.btn { background: var(--siren); color: #fff; border: 0; box-shadow: 0 .8cqh 0 #8f1626; padding: 1.8cqh 6cqh; font: 4.4cqh var(--f-display); letter-spacing: .05em; margin-top: 1cqh; }
.btn:active { transform: translateY(.6cqh); box-shadow: 0 .2cqh 0 #8f1626; }
.ov.win h2 { color: var(--glow); } .ov.lose h2 { color: var(--siren); }
/* 실패 화면: 붉게 맥동, 제목은 내려찍히고 나머지는 늦게 떠오름 */
.ov.lose { background: radial-gradient(ellipse at center, rgba(90, 0, 14, .92), rgba(5, 0, 2, .97) 70%); animation: loseBg 2.4s ease-in-out infinite; }
.ov.lose h2 { font-size: 13cqh; text-shadow: 0 0 3cqh rgba(255, 61, 82, .7), .7cqh .7cqh 0 #000; animation: slam .55s cubic-bezier(.2, 1.6, .4, 1) both, jolt .35s .55s both; }
.ov.lose .eyebrow { font-size: 3.4cqh; animation: flicker 1.1s steps(1) infinite; }
.ov.lose p, .ov.lose .stats, .ov.lose .btn { animation: rise .6s 1s ease-out both; }
.ov.lose .btn { animation-delay: 1.6s; }
@keyframes loseBg { 0%, 100% { box-shadow: inset 0 0 12cqh rgba(255, 30, 50, .25); } 50% { box-shadow: inset 0 0 22cqh rgba(255, 30, 50, .55); } }
@keyframes slam { 0% { transform: scale(3.2); opacity: 0; filter: blur(1cqh); } 100% { transform: scale(1); opacity: 1; filter: none; } }
@keyframes jolt { 0%, 100% { transform: translate(0); } 20% { transform: translate(-1.6cqh, .8cqh); } 40% { transform: translate(1.4cqh, -.8cqh); } 60% { transform: translate(-.8cqh, .4cqh); } 80% { transform: translate(.5cqh, 0); } }
@keyframes flicker { 0%, 100% { opacity: 1; } 8% { opacity: .2; } 12% { opacity: 1; } 55% { opacity: .5; } 60% { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(2cqh); } to { opacity: 1; transform: none; } }
#clock.dead { border-color: var(--siren); animation: jolt .4s; }
#clock.dead #timer { color: var(--siren); animation: blink .3s steps(2) infinite; }
#clock.dead small { color: var(--siren); }
/* 엔딩 도감 */
.ov .btn.ghost { background: transparent; color: var(--ink); box-shadow: none; border: .4cqh solid var(--line); font-size: 3.2cqh; padding: 1.1cqh 4cqh; margin-top: 0; }
.end-row { display: flex; gap: 2cqh; align-items: center; justify-content: center; flex-wrap: wrap; }
.badge { font: 3cqh var(--f-display); color: #1a1200; background: var(--amber); padding: .3cqh 1.6cqh; transform: rotate(-4deg); animation: badgePop .5s 1.1s both; }
.count { font: 700 2.6cqh var(--f-body); color: var(--muted); }
@keyframes badgePop { 0% { transform: scale(0) rotate(-20deg); } 70% { transform: scale(1.3) rotate(-4deg); } 100% { transform: scale(1) rotate(-4deg); } }
#dex { z-index: 70; gap: 1.6cqh; }
.dex-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2cqh; width: 100%; max-width: 130cqh; }
.dex-card { background: rgba(20, 24, 41, .92); border: .4cqh solid var(--line); padding: 1.1cqh 1.6cqh; text-align: left; min-height: 13cqh; }
.dex-card small { display: block; font: 2.4cqh var(--f-digit); color: var(--muted); }
.dex-card b { display: block; font: 3.6cqh/1.1 var(--f-display); color: var(--ink); margin: .2cqh 0 .4cqh; }
.dex-card span { font: 700 2.1cqh/1.4 var(--f-body); color: var(--muted); }
.dex-card.win { border-color: #2f7a64; } .dex-card.win b { color: var(--glow); }
.dex-card.lose { border-color: #7a2a36; } .dex-card.lose b { color: var(--siren); }
.dex-card.rare { border-color: #8a7230; } .dex-card.rare b { color: var(--amber); }
.dex-card.locked b { color: #5a6080; }
/* 타이틀 · 이름 · 설정 */
.ov .btn:disabled { opacity: .4; }
#who { font: 700 2.8cqh var(--f-body); color: var(--amber); }
#nameOv, #settings { z-index: 75; }
#nameOv, #settings, #dex { background: rgba(7, 8, 15, .97); }
#nameOv h2 { font-size: 7cqh; }
.name-row { display: flex; gap: 1.6cqh; align-items: center; }
#nameIn { font: 700 3.6cqh var(--f-body); width: 42cqh; background: #1b2033; color: var(--ink); border: .4cqh solid var(--line); padding: 1.2cqh 1.6cqh; }
#nameIn:focus { border-color: var(--glow); outline: none; }
#nameMsg { min-height: 3.6cqh; } #nameMsg.bad { color: var(--siren); } #nameMsg.ok { color: var(--glow); }
.prof-list { display: flex; flex-wrap: wrap; gap: 1.2cqh; justify-content: center; max-width: 120cqh; }
.prof-list button { font: 700 2.8cqh var(--f-body); color: var(--ink); background: rgba(20, 24, 41, .9); border: .4cqh solid var(--line); padding: 1cqh 2cqh; }
.prof-list button:hover { border-color: var(--glow); }
.set-grid { display: grid; grid-template-columns: auto 50cqh; gap: 2.6cqh 4cqh; align-items: center; font: 700 3cqh var(--f-body); text-align: left; }
.set-grid input[type=range] { width: 100%; accent-color: var(--glow); }
.set-grid input[type=checkbox] { width: 3.6cqh; height: 3.6cqh; accent-color: var(--glow); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

const COARSE = matchMedia('(pointer: coarse)');   // 손가락으로 조작하는 기기
function fit() {
  // 이름을 입력하는 동안 휴대폰 키보드가 올라와 화면이 줄어도 무대를 다시 맞추지 않는다
  if (COARSE.matches && document.activeElement && document.activeElement.tagName === 'INPUT') return;
  const st = getComputedStyle(document.body);
  let aw = document.body.clientWidth - parseFloat(st.paddingLeft) - parseFloat(st.paddingRight);
  let ah = document.body.clientHeight - parseFloat(st.paddingTop) - parseFloat(st.paddingBottom);
  // 세로로 든 휴대폰: 무대를 90도 돌려 가로 화면처럼 꽉 채운다 (휴대폰을 옆으로 돌려 들면 바로 보인다)
  const rot = COARSE.matches && ah > aw;
  if (rot) [aw, ah] = [ah, aw];

}

// ───── 연출 ─────
function transition(cb) { G.fadeDir = 1; G.fadeCb = cb; }
function cutscene(steps) { G.cut = { steps, i: 0, t: 0, started: false }; }
function moveToward(a, x, y, sp, dt) {
  const dx = x - a.x, dy = y - a.y, d = Math.hypot(dx, dy);
  if (d < 1) { a.x = x; a.y = y; a.moving = false; return true; }
  const m = Math.min(d, sp * dt); a.x += dx / d * m; a.y += dy / d * m; a.anim += dt; a.moving = true;
  return false;
}
function updateCut(dt) {
  const c = G.cut; if (!c) return;
  const s = c.steps[c.i];
  if (!s) { G.cut = null; return; }
  let done = false;
  if (s.wait != null) { c.t += dt; done = c.t >= s.wait; }
  else if (s.move) { done = true; for (const [a, x, y] of s.move) if (!moveToward(a(), x, y, s.speed || 40, dt)) done = false; }
  else if (s.fn) { s.fn(); done = true; }
  else if (s.dlg) { if (!c.started) { c.started = true; Dlg.start(s.dlg()); } done = !Dlg.active; }
  if (done) { c.i++; c.t = 0; c.started = false; }
}

function updateEvan(dt) {
  const d = G.drive, e = d.evan; e.t += dt;
  for (const b of e.bits) { b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 90 * dt; b.a -= dt * 0.9; }
  e.bits = e.bits.filter(b => b.a > 0);
  if (e.phase === 'chase') {
    d.v = Math.max(0, d.v - 160 * dt);
    const v = DIRV[d.dir];
    for (let dist = d.v * dt; dist > 0;) {
      const st = Math.min(2, dist); dist -= st;
      const nx = d.x + v[0] * st, ny = d.y + v[1] * st;
      if (fits(nx, ny) && !cadeHit(nx, ny)) { d.x = nx; d.y = ny; } else { d.v = 0; break; }
    }
    const tx = d.x + e.ax, ty = d.y + e.ay, dx = tx - e.x, dy = ty - e.y, dd = Math.hypot(dx, dy), sp = 280 * dt;
    if (dd > sp) { e.x += dx / dd * sp; e.y += dy / dd * sp; }
    else {
      e.x = tx; e.y = ty;
      if (d.v < 5) {
        e.phase = 'transform'; e.t = 0; G.wflash = 0.8; G.shake = 0.4;
        beep(400, 0.08); beep(800, 0.12, 0.05, 'sawtooth'); SFX.whoosh();
        for (let k = 0; k < 28; k++) e.bits.push({ x: e.x + rnd(-7, 7), y: e.y + rnd(-4, 4), vx: rnd(-70, 70), vy: rnd(-90, -20), a: 1, s: pick([1, 2]), c: pick(['#2438c0', '#2450d0', '#f0f0f0', '#ff9a2a', '#e8302a', '#14161f']) });
      }
    }
  } else if (e.phase === 'transform') {
    if (Math.floor(e.t * 7) !== Math.floor((e.t - dt) * 7)) SFX.clank();
    if (!e.s1 && e.t >= 0.5) { e.s1 = true; beep(600, 0.1); G.shake = 0.3; }
    if (!e.s2 && e.t >= 1.0) { e.s2 = true; beep(1000, 0.25, 0.05, 'sawtooth'); G.wflash = 0.5; SFX.chime(); }
    if (e.t >= 1.6) {
      e.phase = 'lift'; e.t = 0;
      Dlg.start({ blocking: false, auto: true, lines: [['파란 로봇', '걱정 마. 병원까지 내가 데려다줄게!'], [G.helper.name, '...내 차가... 들린다...?']] });
    }
  } else if (e.phase === 'lift') {
    if (!e.carry) {
      const dx = d.x - e.x, dy = d.y - e.y, dd = Math.hypot(dx, dy), sp = 40 * dt;
      if (dd > sp) { e.x += dx / dd * sp; e.y += dy / dd * sp; } else { e.x = d.x; e.y = d.y; e.carry = true; beep(200, 0.15, 0.06); }
    } else {
      e.lk = Math.min(1, e.lk + dt * 2);
      if (e.lk >= 1) {
        e.path = findPath(d.x, d.y, d.target.x, d.target.y); e.pi = 0; e.phase = 'run'; e.t = 0;
        if (!e.path) e.phase = 'set';
      }
    }
  } else if (e.phase === 'run') {
    let step = 230 * dt;
    while (step > 0 && e.pi < e.path.length) {
      const [px, py] = e.path[e.pi], dx = px - d.x, dy = py - d.y, dd = Math.hypot(dx, dy);
      if (dd > 0.01) { d.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'ArrowRight' : 'ArrowLeft') : (dy > 0 ? 'ArrowDown' : 'ArrowUp'); if (Math.abs(dx) > 0.5) e.face = dx > 0 ? 'ArrowRight' : 'ArrowLeft'; }

    e.foot -= dt; if (e.foot <= 0) { e.foot = 0.16; beep(70, 0.05, 0.07); G.shake = Math.max(G.shake, 0.06); }
    if (e.pi >= e.path.length) { e.phase = 'set'; e.t = 0; }
  } else if (e.phase === 'set') {
    e.lk = Math.max(0, e.lk - dt * 2.5);
    if (e.lk <= 0) {

      const v = DIRV[d.dir]; e.x = d.x - v[1] * 16; e.y = d.y + v[0] * 16;

}

function drawEvan(camX, camY) {
  const e = G.drive.evan, x = e.x - camX, y = e.y - camY;
  for (const b of e.bits) { ctx.globalAlpha = Math.max(0, b.a); R(b.x - camX, b.y - camY, b.s, b.s, b.c); }
  ctx.globalAlpha = 1;
  if (e.phase === 'chase') {
    const v = DIRV[e.dir];
    for (let k = -1; k <= 1; k++) {
      if (v[1] === 0) R(x - v[0] * 13 - (v[0] > 0 ? 8 : 0), y + k * 3, 8, 1, 'rgba(150,200,255,.6)');
      else R(x + k * 3, y - v[1] * 13 - (v[1] > 0 ? 8 : 0), 1, 8, 'rgba(150,200,255,.6)');

    drawMini(x, y, e.dir, 'evan');
  } else if (e.phase === 'transform') {
    lampGlow(x, y, 34, 'rgba(80,140,255,.4)');

// ───── 골든타임 종료: 심정지 연출 → 게임오버 ─────
const ECG_BEATS = [[40, 16], [110, 10], [190, 5]];   // [화면 x, 높이] 점점 약해지는 박동
function startDeath() {
  G.ended = true; G.timerOn = false; closePhone(true);
  Dlg.active = false; el.dlg.hidden = true; G.cut = null; G.medFade = null;
  el.pad.classList.remove('on'); el.phoneBtn.classList.remove('glow'); setObj('');
  if (G.drive) G.drive.v = 0;
  G.dying = { t: 0, beat: 0, flat: false };
  G.shake = 1.2; G.flash = 1.4;
  beep(55, 0.5, 0.14, 'sawtooth'); beep(110, 0.3, 0.08);
  el.clock.classList.add('dead');
}
function updateDeath(dt) {
  const D = G.dying; D.t += dt;
  if (D.t < 2.8) G.shake = Math.max(G.shake, 0.15);
  const head = (D.t - 0.2) / 2.6 * W;
  while (D.beat < ECG_BEATS.length && head >= ECG_BEATS[D.beat][0]) {
    const a = ECG_BEATS[D.beat][1] / 16; D.beat++;
    beep(60, 0.2, 0.14 * a, 'sine'); beep(880, 0.07, 0.05 * a);
    G.flash = Math.max(G.flash, 0.6 * a);
  }
  if (!D.flat && D.t >= 2.8) { D.flat = true; beep(880, 2.2, 0.05, 'sine'); }
  if (D.t >= 3.8) G.fade = Math.min(1, (D.t - 3.8) / 0.8);
  if (D.t >= 4.8) { G.dying = null; ending(G.drive ? 'road' : 'home'); }
}
function drawDeath() {
  const D = G.dying, t = D.t;
  // 색이 빠지고 붉게 가라앉는다
  ctx.save();
  ctx.globalCompositeOperation = 'saturation'; ctx.globalAlpha = Math.min(1, t / 1.6);
  R(0, 0, W, H, '#808080');
  ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = Math.min(1, t / 1.2);
  R(0, 0, W, H, '#b03040');
  ctx.restore();
  // 심전도 띠
  const cy = H / 2 + 14, band = Math.min(1, t / 0.4);
  R(0, cy - 26 * band, W, 52 * band, 'rgba(4,6,10,.88)');
  R(0, cy - 26 * band, W, 1, '#ff3d52'); R(0, cy + 26 * band - 1, W, 1, '#ff3d52');
  if (band < 1) return;
  const head = clamp((t - 0.2) / 2.6 * W, 0, W);
  const ecg = x => {
    let y = 0;
    for (const [bx, a] of ECG_BEATS) {
      const u = x - bx;
      y += -a * Math.exp(-((u / 1.6) ** 2)) + a * 0.45 * Math.exp(-(((u - 4) / 1.8) ** 2)) - a * 0.18 * Math.exp(-(((u - 12) / 4) ** 2));
    }
    return y;
  };
  const flat = D.flat, col = flat ? (Math.floor(t * 3) % 2 ? '#ff3d52' : '#ff8090') : '#4cff8a';
  ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = 0; x <= head; x++) { const y = cy + ecg(x); x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke();
  if (!flat) { lampGlow(head, cy + ecg(head), 10, 'rgba(76,255,138,.5)'); R(head - 1, cy + ecg(head) - 1, 2, 2, '#eaffef'); }
  // 큰 글자
  const pop = flat ? 1 + Math.max(0, 0.6 - (t - 2.8) * 2) : 0;
  if (flat) {
    T('심정지', W / 2 + rnd(-1, 1) * (pop - 1) * 6, cy - 46, { size: Math.round(26 * pop), color: '#ff3d52' });
    T('00:00', W / 2, cy + 38, { size: 12, color: Math.floor(t * 4) % 2 ? '#ffffff' : '#ff3d52' });
  } else {
    T('맥박이 약해진다...', W / 2, cy - 38, { size: 9, color: '#ffb0b8' });
  }
}

const LS_PROFILES = 'goldentime.profiles', LS_CURRENT = 'goldentime.current';

const FB_VER = '10.12.2';
async function firebaseBackend(cfg) {
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [{ initializeApp }, A, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = initializeApp(cfg), auth = A.getAuth(app), fs = F.getFirestore(app);
  await new Promise(res => { const off = A.onAuthStateChanged(auth, () => { off(); res(); }); });
  if (!auth.currentUser) await A.signInAnonymously(auth);   // 처음엔 익명으로, 원하면 구글 계정 연결
  const uid = () => auth.currentUser.uid;
  return {
    mode: 'firebase',
    async load() { const snap = await F.getDoc(F.doc(fs, 'users', uid())); return snap.exists() ? snap.data() : null; },
    save: p => F.setDoc(F.doc(fs, 'users', uid()), plain(p)),
    // 이름 문서는 "없을 때 만들기"만 허용(firestore.rules). 이미 있으면 거절되고, 내 것인지 확인한다
    async claim(name, key) {
      const ref = F.doc(fs, 'names', key);
      try { await F.setDoc(ref, { uid: uid(), name, at: Date.now() }); return 'ok'; }
      catch (e) {
        if (e.code !== 'permission-denied') return 'error';
        const snap = await F.getDoc(ref);
        return snap.exists() && snap.data().uid === uid() ? 'ok' : 'taken';
      }
    },
    googleLinked: () => auth.currentUser.providerData.some(pd => pd.providerId === 'google.com'),
    // 구글 연결: 이 기기의 익명 기록을 구글 계정에 붙인다. 그 구글 계정이 이미 다른 기기에서 쓰이고 있으면 그쪽 기록으로 바꾼다
    async linkGoogle() {
      const prov = new A.GoogleAuthProvider();
      try { await A.linkWithPopup(auth.currentUser, prov); return 'linked'; }
      catch (e) {
        if (e.code !== 'auth/credential-already-in-use') throw e;
        await A.signInWithCredential(auth, A.GoogleAuthProvider.credentialFromError(e));
        return 'switched';
      }
    },
  };
}
async function claudeBackend() {
  if (!(window.claude && window.claude.use)) return null;
  const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  if (!db || !user) return null;
  const uid = await user.id();
  if (!uid || (await user.can('data.write')) === false) return null;   // 보기 전용이면 이 기기에 저장
  const pref = db.doc(`data/users/${uid}/profile`);
  return {
    mode: 'claude',
    async load() { const snap = await pref.get(); return snap.exists ? snap.data() : null; },
    save: p => pref.set(plain(p)),
    // 이름 하나에 문서 하나: 잠깐 잠그고(acquire) 비어 있을 때만 내 것으로 기록한다
    async claim(name, key) {
      const ref = db.doc('names/' + key);
      const lease = await ref.acquire({ holder: uid, ttlMs: 5000 });
      if (!lease.acquired) return 'taken';
      const snap = await ref.get(), cur = snap.exists ? snap.data() : null;
      if (cur && cur.owner && cur.owner !== uid) return 'taken';
      await ref.set({ owner: uid, name, at: Date.now() });
      return 'ok';
    },
  };
}

async function initStore() {
  let be = null;

  }
  if (!be) { try { be = await claudeBackend(); } catch (e) { be = null; } }

    try { const d = await be.load(); if (d && d.name) P = fixProfile(d); } catch (e) { /* 새 프로필로 */ }

const NAME_RE = /^[가-힣A-Za-z0-9]{2,10}$/;
async function createProfile(raw) {
  const name = raw.trim();
  if (!NAME_RE.test(name)) return '이름은 2~10자, 한글(완성형)·영문·숫자만 쓸 수 있어요';
  const key = nameKey(name), taken = '이미 다른 플레이어가 쓰는 이름이에요. 다른 이름을 골라 주세요';
  let carried = [];
  if (Store.be) {
    let r = 'error';
    try { r = await Store.be.claim(name, key); } catch (e) { r = 'error'; }
    if (r === 'taken') return taken;
    if (r !== 'ok') return '지금은 이름을 확인할 수 없어요. 잠시 후 다시 해 주세요';
  } else {
    const all = lsGet(LS_PROFILES, {});
    if (all[key]) return taken;
    // 예전 버전에서 모은 엔딩은 이 기기의 첫 프로필로 옮긴다
    if (!Object.keys(all).length) carried = lsGet('goldentime.endings', []);
  }
  useProfile(fixProfile({ name, endings: carried, settings: { ...SET } }));
  saveProfile(true);
  return null;
}

// 이어하기: 판이 안정된 순간(체크포인트)을 저장해 두었다가 같은 시드로 다시 만든 뒤 되살린다
function snapshot() {
  if (!G || G.ended || G.phase === 'title' || G.dying || G.crash) return undefined;
  const base = { seed: G.seed, rich: G.rich, lambo: G.lambo, time: Math.round(G.time), calls: G.calls, refused: G.refused, c119: G.c119,
    crashes: G.crashes, evanMet: G.evanMet, helper: G.helper ? G.helper.name : null, route: G.route, px: Math.round(G.p.x), py: Math.round(G.p.y) };
  if (G.scene === 'house' && ['collapsed', 'after119'].includes(G.phase) && !Dlg.active && !G.cut) return { ...base, kind: 'house', phase: G.phase };
  if (G.phase === 'waitFriend' && !Dlg.active && G.helper) return { ...base, kind: 'wait' };
  if (G.phase === 'waitAmb' && G.helper) return { ...base, kind: 'amb' };
  const d = G.drive;
  if (G.scene === 'drive' && d && !d.arrived && !d.evan) {
    if (d.kind === 'heli' || d.kind === 'run') return undefined;
    if (d.kind === 'amb') return { ...base, kind: 'amb' };
    return { ...base, kind: 'drive', x: Math.round(d.x), y: Math.round(d.y), dir: d.dir, odo: Math.round(d.odo), saidLow: !!d.saidLow,
      tk: d.target ? d.target.k : -1, met: MAP.npcs.map((n, i) => n.met ? i : -1).filter(i => i >= 0) };
  }
  return undefined;
}
function autosave(now) {
  if (!P) return;
  const sv = snapshot(); if (sv === undefined) return;
  const key = JSON.stringify(sv); if (key === G.lastSave) return;
  G.lastSave = key; P.save = sv; saveProfile(now);
}

  G.helper = sv.helper ? (G.favs.find(c => c.name === sv.helper) || G.contacts.find(c => c.name === sv.helper) || null) : null;

const ROOFS = ['#6e3a38', '#384a72', '#6e6238', '#4a3a66', '#386658', '#7a5034', '#5a5a66'];

function forestFill() {
  const c = document.createElement('canvas'); c.width = c.height = 42;
  const g = c.getContext('2d');
  g.fillStyle = '#11241a'; g.fillRect(0, 0, 42, 42);
  for (let j = 0; j < 6; j++) for (let i = 0; i < 6; i++) {
    const x = i * 7 + 3 + (j % 2) * 3, y = j * 7 + 3;
    g.fillStyle = (i + j) % 3 ? '#1a3d26' : '#1f4a2d'; g.fillRect(x - 3, y - 2, 7, 5); g.fillRect(x - 2, y - 3, 5, 7);
    g.fillStyle = '#2a5c38'; g.fillRect(x - 1, y - 2, 2, 2);
  }
  o.fillStyle = o.createPattern(c, 'repeat'); o.fillRect(0, 0, TW, TH);
}
function tree(x, y) { F(x - 3, y - 2, 7, 5, '#1f4a2b'); F(x - 2, y - 3, 5, 7, '#1f4a2b'); F(x - 1, y - 2, 2, 2, '#2f6b3f'); }
function win(x, y, p = 0.5) { F(x, y, 2, 2, Math.random() < p ? '#ffd77a' : '#283044'); }
function water(x, y, w, h) {

function fits(x, y) {
  const m = MAP.mask;
  for (let k = 0; k < 5; k++) {
    const px = x + (k === 4 ? 0 : k % 2 ? 5 : -5), py = y + (k === 4 ? 0 : k < 2 ? -5 : 5);
    const cx = Math.floor(px / CELL), cy = Math.floor(py / CELL);
    if (cx < 0 || cy < 0 || cx >= MW || cy >= MH || !m[cy * MW + cx]) return false;
  }
  return true;
}
function findPath(sx, sy, tx, ty) {
  const maxCx = Math.min(MW, Math.ceil((Math.max(sx, tx) + 200) / CELL));
  const toC = v => Math.floor(v / CELL);
  const s = toC(sy) * MW + toC(sx), t = toC(ty) * MW + toC(tx);
  const prev = new Int32Array(MW * MH).fill(-1), q = new Int32Array(MW * MH);
  let h = 0, tl = 0; q[tl++] = s; prev[s] = s;
  while (h < tl) {
    const c = q[h++]; if (c === t) break;
    const cx = c % MW, cy = (c / MW) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= maxCx || ny >= MH) continue;
      const n = ny * MW + nx;
      if (prev[n] !== -1 || !fits(nx * CELL + 2, ny * CELL + 2)) continue;
      prev[n] = c; q[tl++] = n;
    }
  }
  if (prev[t] === -1) return null;
  const pts = [];
  for (let c = t; c !== s; c = prev[c]) pts.push([(c % MW) * CELL + 2, ((c / MW) | 0) * CELL + 2]);
  return pts.reverse();
}

      const v = DIRV[d.dir], nx = d.x + v[0] * s, ny = d.y + v[1] * s;
      if (fits(nx, ny) && !cadeHit(nx, ny) && !lightBlocks(nx, ny)) { d.x = nx; d.y = ny; d.odo += s; } else { d.v = 0; break; }
      tryTurn();
    }
    // 꺾을 길이 없으면 같은 방향 옆 차선으로 이동, 반대 차선으로는 못 넘어간다
    const lr = laneRange(d), hzd = d.dir === 'ArrowLeft' || d.dir === 'ArrowRight';
    const moveLat = (amt) => {
      const nx = hzd ? d.x : d.x + amt, ny = hzd ? d.y + amt : d.y;
      if (fits(nx, ny) && !cadeHit(nx, ny)) { d.x = nx; d.y = ny; }
    };
    if (held && held !== d.dir && OPP[held] !== d.dir) {
      const n = DIRV[held], cur = hzd ? d.y : d.x;
      let amt = (hzd ? n[1] : n[0]) * LANE_SPEED * dt;
      if (lr) amt = clamp(cur + amt, lr[0], lr[1]) - cur;
      if (amt) moveLat(amt);
    }
    if (lr) {
      const cur = hzd ? d.y : d.x, want = clamp(cur, lr[0], lr[1]);
      if (want !== cur) moveLat(Math.sign(want - cur) * Math.min(Math.abs(want - cur), 90 * dt));
    }
  }
  for (const n of MAP.npcs) {
    const along = n.hz ? (d.x - n.x) * n.s : (d.y - n.y) * n.s, lat = n.hz ? d.y - n.y : d.x - n.x;
    if (!(along > 0 && along < n.hl + 15 && Math.abs(lat) < n.hw + 3)) n.p += n.s * n.v * dt;
    if (n.p < n.a) { n.p = n.a; n.s = 1; } else if (n.p > n.b) { n.p = n.b; n.s = -1; }
    if (n.hz) { n.x = n.p; n.y = n.c0 + (n.s > 0 ? n.lane : -n.lane); n.dir = n.s > 0 ? 'ArrowRight' : 'ArrowLeft'; }
    else { n.y = n.p; n.x = n.c0 + (n.s > 0 ? -n.lane : n.lane); n.dir = n.s > 0 ? 'ArrowDown' : 'ArrowUp'; }
    if (n.kind === 'evan' && !FORCE_GUITAR && !n.met && d.kind === 'friend' && !d.evan && !G.ended && Math.hypot(n.x - d.x, n.y - d.y) < 90) {
      n.met = true; G.evanMet++;
      if (G.evanMet >= EVAN_NEED) startEvan(); else { popup(`파란 스포츠카 ${G.evanMet}대째!`, true); beep(990, 0.06, 0.03); }
    }
    const pv = DIRV[d.dir], mine = (n.x - d.x) * pv[0] + (n.y - d.y) * pv[1] > 0 && d.v > 5;
    const nl = n.hl + 6, nw = n.hw + 3;   // 내 차(길이 7·폭 4 반쪽)와 겹칠 때만, 1px 여유
    if (!d.auto && !d.evan && !G.ended && mine && d.bump <= 0 && Math.abs(n.x - d.x) < (n.hz ? nl : nw) && Math.abs(n.y - d.y) < (n.hz ? nw : nl)) {
      d.bump = 1.5; d.v = 0; G.shake = 0.35; SFX.crash();
      const v = DIRV[d.dir];
      for (let k = 0; k < 6; k++) if (fits(d.x - v[0] * 2, d.y - v[1] * 2)) { d.x -= v[0] * 2; d.y -= v[1] * 2; }
      G.crashes++;
      if (G.crashes >= 3) { startCrash(); return; }
      penalty(60); popup(`쿵! 사고가 나서 지체됐다 (-1분 · 사고 ${G.crashes}/3)`, true);
    }
  }
  const ti = townAt(d.x);
  if (ti !== d.town) { d.town = ti; if (!d.auto) popup(`${MAP.towns[ti].name}에 들어왔다`, true); }
  if (d.auto) return;
  const here = MAP.towns[ti].name;
  const obj = d.target
    ? `목적지 <b>${d.target.town} ${d.target.name}</b><br>내비의 노란 화살표를 따라가자 · 지금 ${here}`
    : `받아줄 병원 수소문 중... 일단 동쪽으로!<br>지금 ${here}`;
  if (obj !== d.objKey) { d.objKey = obj; setObj(obj); }
  if (d.target && !d.evan && Math.hypot(d.target.x - d.x, d.target.y - d.y) < 22) arrive();
}

function drawPerson(a) {
  if (!a || a.hidden) return;
  const x = Math.round(a.x), y = Math.round(a.y), pal = a.pal;
  if (a.lying) {
    ctx.save(); ctx.translate(x, y - 3); ctx.rotate(-Math.PI / 2);
    const rows = BODY.concat(LEGS[0]);
    for (let r = 0; r < rows.length; r++) for (let c = 0; c < 8; c++) { const ch = rows[r][c]; if (ch !== '.') R(-4 + c, -6 + r, 1, 1, pal[ch]); }
    ctx.restore(); return;
  }
  R(x - 4, y - 1, 8, 2, 'rgba(0,0,0,.3)');
  const f = a.moving ? 1 + (Math.floor(a.anim * 8) % 2) : 0;

    const ox = i * TW, sx = Math.max(0, camX - ox), ex = Math.min(TW, camX + W - ox);

  if (d.kind === 'heli') {
    // 그림자는 땅에, 헬기는 떠오른 만큼 위로·크게
    const a = d.alt || 0;
    ctx.globalAlpha = 0.35; R(px - 9 + a * 8, py - 4 + a * 14, 20, 9, '#000'); ctx.globalAlpha = 1;
    drawHeli(px, py - a * 10, ANG[d.dir], 0.9 + a * 0.35, (d.rotor || 0) * 26);
  } else if (d.kind === 'run') {
    for (const p of d.dust) { ctx.globalAlpha = p.a; R(p.x - camX - 1, p.y - camY - 1, 3, 2, '#c8c0b0'); }
    ctx.globalAlpha = 1;
    const back = DIRV[d.dir];
    for (let k = -1; k <= 1; k++) R(px - back[0] * 10 - (back[0] > 0 ? 6 : 0) + (back[0] ? 0 : k * 3), py - 6 + (back[0] ? k * 3 : 0) - back[1] * 10, back[0] ? 6 : 1, back[0] ? 1 : 6, 'rgba(255,255,255,.55)');
    drawPerson({ x: px, y: py + 4, pal: PAL_ME, moving: true, anim: G.t * 2 });
    drawGuitar(px - 3, py, null);
  } else if (!(d.evan && d.evan.carry)) drawMini(px, py, d.dir, d.kind === 'amb' ? 'amb' : (d.bump > 0 && Math.floor(G.t * 10) % 2 ? '#ffffff' : myCar()));
  if (G.crash) {
    if (Math.floor(G.crash.t * 2.5) % 2) { lampGlow(px, py, 18, 'rgba(255,150,40,.45)'); R(px - 8, py - 5, 2, 2, '#ffa030'); R(px + 6, py - 5, 2, 2, '#ffa030'); R(px - 8, py + 3, 2, 2, '#ffa030'); R(px + 6, py + 3, 2, 2, '#ffa030'); }
    for (const p of G.crash.smoke) { ctx.globalAlpha = p.a; R(p.x - camX - p.r, p.y - camY - p.r, p.r * 2, p.r * 2, '#8a8a90'); }
    ctx.globalAlpha = 1;
  }
  if (d.evan) drawEvan(camX, camY);
  for (const l of MAP.labels) { const x = l.x - camX, y = l.y - camY; if (x > -90 && x < W + 90 && y > -20 && y < H + 20) drawLabel(l, x, y); }
  if (d.target && !d.arrived) {
    const tx = d.target.x - camX, ty = d.target.y - camY;
    if (tx >= 8 && tx <= W - 8 && ty >= 8 && ty <= H - 8) {
      const b = Math.round(Math.sin(G.t * 8) * 2);
      R(tx - 4, ty - 16 + b, 9, 9, '#ff3d52'); R(tx - 3, ty - 12 + b, 7, 1, '#fff'); R(tx, ty - 15 + b, 1, 7, '#fff');
    }
  }

  // 내비게이션: 주변 길 전체 + 병원 + 가야 할 길
  const nw = 76, nh = 46, nx = 6, ny = H - nh - 6, span = 18;
  const wx0 = d.x - nw * span / 2, wy0 = d.y - nh * span / 2;
  R(nx - 2, ny - 2, nw + 4, nh + 4, '#6a76a8'); R(nx - 1, ny - 1, nw + 2, nh + 2, '#0b0e1a');
  ctx.save(); ctx.beginPath(); ctx.rect(nx, ny, nw, nh); ctx.clip();
  R(nx, ny, nw, nh, '#0f1524');
  const sx0 = Math.max(0, wx0 / 8), sy0 = Math.max(0, wy0 / 8), sx1 = Math.min(WW / 8, (wx0 + nw * span) / 8), sy1 = Math.min(TH / 8, (wy0 + nh * span) / 8);
  if (sx1 > sx0 && sy1 > sy0) ctx.drawImage(MAP.mini, sx0, sy0, sx1 - sx0, sy1 - sy0, nx + (sx0 * 8 - wx0) / span, ny + (sy0 * 8 - wy0) / span, (sx1 - sx0) * 8 / span, (sy1 - sy0) * 8 / span);
  const m = (x, y) => [nx + (x - wx0) / span, ny + (y - wy0) / span];
  for (let i = 1; i < NT; i++) { const [bx] = m(i * TW, 0); R(bx, ny, 1, nh, 'rgba(122,134,184,.35)'); }
  if (d.route) {
    for (let i = 0; i < d.route.length; i += 2) { const [rx, ry] = m(...d.route[i]); R(rx - 0.5, ry - 0.5, 1.5, 1.5, '#ffd84a'); }
    for (let i = 24; i < d.route.length - 4; i += 30) { const [a1, b1] = m(...d.route[i]), [a2, b2] = m(...d.route[i + 4]); chevron(a1, b1, Math.atan2(b2 - b1, a2 - a1), 2.5, '#ffd84a'); }
  }
  for (const h of MAP.towns.map(t => ({ x: t.hosp.ex, y: t.hosp.ey, open: t.hosp.open })).concat(MAP.minor)) {
    const [hx, hy] = m(h.x, h.y), s = h.open ? 4 : 3;
    const bg = h.open ? (blink ? '#ff3d52' : '#ffffff') : '#e0508c', fg = h.open && !blink ? '#ff3d52' : '#ffffff';
    R(hx - s, hy - s, s * 2 + 1, s * 2 + 1, bg); R(hx - s + 1, hy, s * 2 - 1, 1, fg); R(hx, hy - s + 1, 1, s * 2 - 1, fg);
  }
  const [mcx, mcy] = m(d.x, d.y);
  chevron(mcx, mcy, ANG[d.dir], 3, '#ffc95a');
  ctx.restore();
  if (d.target) {
    const [tx, ty] = m(d.target.x, d.target.y);
    if (tx < nx || tx > nx + nw || ty < ny || ty > ny + nh) {
      const a = Math.atan2(ty - mcy, tx - mcx);
      chevron(clamp(mcx + Math.cos(a) * 40, nx + 5, nx + nw - 5), clamp(mcy + Math.sin(a) * 40, ny + 5, ny + nh - 5), a, 3, blink ? '#ff3d52' : '#ff9aa6');
    }
  }
  R(nx, ny, 36, 8, 'rgba(11,14,26,.8)');
  T(MAP.towns[townAt(d.x)].name, nx + 3, ny + 4.5, { size: 5, color: '#f4ecdc', align: 'left' });
  if (!d.auto) { R(nx + nw - 30, ny, 30, 8, 'rgba(11,14,26,.8)'); T(`${Math.round(d.v)}km/h`, nx + nw - 2, ny + 4.5, { size: 5, color: '#ffc95a', align: 'right' }); }
}

function draw() {
  ctx.setTransform(S, 0, 0, S, 0, 0); ctx.imageSmoothingEnabled = false;
  ctx.save();
  if (G.shake > 0 && SET.shake) { const s = G.dying ? 5 * Math.min(1, G.shake) + 1 : 2; ctx.translate(Math.round(rnd(-s, s)), Math.round(rnd(-s, s))); }
  if (G.scene === 'house') drawHouse(); else if (G.scene === 'outside') drawOutside(); else if (G.scene === 'treat') drawTreat(); else if (G.scene === 'office') drawOffice(); else drawDrive();
  ctx.restore();
  // 심장 박동 비네트
  if (G.timerOn || G.phase === 'collapsing') {
    const beat = Math.pow(Math.max(0, Math.sin(G.t * Math.PI * 2 * 1.3)), 8);
    const danger = 1 - G.time / GOLD;
    const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.62);
    g.addColorStop(0, 'rgba(255,40,60,0)'); g.addColorStop(1, `rgba(255,40,60,${0.12 + danger * 0.25 + beat * 0.25})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (G.faint && G.timerOn) {
    const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.2, W / 2, H / 2, W * 0.6);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.75)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const ph = G.t % 2.6;
    if (ph < 0.6) R(0, 0, W, H, `rgba(0,0,0,${Math.sin(ph / 0.6 * Math.PI) * 0.9})`);
  }
  if (G.dying) drawDeath();
  if (G.wflash > 0) R(0, 0, W, H, `rgba(255,255,255,${Math.min(1, G.wflash) * 0.8})`);
  if (G.flash > 0) R(0, 0, W, H, `rgba(255,40,60,${Math.min(1, G.flash) * 0.5})`);
  if (G.fade > 0) R(0, 0, W, H, `rgba(0,0,0,${G.fade})`);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if ($('#settings').hidden || !el.title.hidden || !el.end.hidden) update(dt);
  draw();
  requestAnimationFrame(frame);
}
newGame(); refreshTitle(); initStore();
requestAnimationFrame(frame);
if (DEBUG) window.__golden = { get G() { return G; }, get MAP() { return MAP; }, get P() { return P; }, Store, AU, Dlg, startCall, findPath };
})();
</script>
